
networks:
  kafka-ops-agents-test:
    external: true

services:
  # ===========================================================================
  # MCP Confluent — Official @confluentinc/mcp-confluent server (HTTP on :3000)
  # ===========================================================================
  mcp-confluent:
    image: node:22-slim
    ports:
      - "3000:3000"
    networks:
      - kafka-ops-agents-test
    volumes:
      - ./mcp-confluent/config.yaml:/etc/mcp/config.yaml:ro
    command: ["npx", "-y", "@confluentinc/mcp-confluent", "--config", "/etc/mcp/config.yaml"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({port:3000,host:'localhost',timeout:2000},r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1)).on('timeout',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # Problem Injector — One-shot seeding of the month-end billing lag scenario
  # ===========================================================================
  problem-injector:
    build:
      context: ./agents
      dockerfile: Dockerfile.agent
    command: python -m problem_injector.app
    networks:
      - kafka-ops-agents-test
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093

  # ===========================================================================
  # Diagnostic Agent — the only agent: diagnoses via MCP Confluent (read-only),
  # then applies and verifies a simulated fix in the same loop.
  # ===========================================================================
  diagnostic-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile.agent
    command: python -m diagnostic.agent
    networks:
      - kafka-ops-agents-test
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      MCP_CONFLUENT_URL: http://mcp-confluent:3000
      DIAGNOSTIC_LLM_PROVIDER: ${DIAGNOSTIC_LLM_PROVIDER:-openai}
      DIAGNOSTIC_LLM_MODEL: ${DIAGNOSTIC_LLM_MODEL:-gpt-4o}
      DIAGNOSTIC_LLM_API_KEY: ${DIAGNOSTIC_LLM_API_KEY}
    depends_on:
      mcp-confluent:
        condition: service_healthy
    restart: unless-stopped
