
networks:
  kafka-ops-agents-test:
    external: true

services:
  # ===========================================================================
  # MCP Confluent — Standalone MCP server exposing Kafka tools to LLMs
  # ===========================================================================
  mcp-confluent:
    build:
      context: ./mcp-confluent
    ports:
      - "3000:3000"
    networks:
      - kafka-ops-agents-test
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      MCP_PORT: "3000"

  # ===========================================================================
  # Problem Injector — One-shot seeding of the 'facturation' problem scenario
  # ===========================================================================
  problem-injector:
    build:
      context: ./agents
      dockerfile: Dockerfile.agent
    command: python -m problem_injector.app
    networks:
      - kafka-ops-agents-test
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093

  # ===========================================================================
  # Agent 1 — Diagnostic (ADK + MCP Confluent tools)
  # ===========================================================================
  diagnostic-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile.agent
    command: python -m diagnostic.agent
    networks:
      - kafka-ops-agents-test
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      MCP_CONFLUENT_URL: http://mcp-confluent:3000
      DIAGNOSTIC_LLM_PROVIDER: ${DIAGNOSTIC_LLM_PROVIDER:-openai}
      DIAGNOSTIC_LLM_MODEL: ${DIAGNOSTIC_LLM_MODEL:-gpt-4o}
      DIAGNOSTIC_LLM_API_KEY: ${DIAGNOSTIC_LLM_API_KEY}
    depends_on:
      mcp-confluent:
        condition: service_started
    restart: unless-stopped

  # ===========================================================================
  # Agent 2 — Remediation (ADK + Agent Skill SKILL.md)
  # ===========================================================================
  remediation-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile.agent
    command: python -m remediation.agent
    networks:
      - kafka-ops-agents-test
    volumes:
      - ./skills:/app/skills:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SKILL_PATH: /app/skills/kafka-streams-filter/SKILL.md
      REMEDIATION_LLM_PROVIDER: ${REMEDIATION_LLM_PROVIDER:-anthropic}
      REMEDIATION_LLM_MODEL: ${REMEDIATION_LLM_MODEL:-claude-sonnet-4}
      REMEDIATION_LLM_API_KEY: ${REMEDIATION_LLM_API_KEY}
    restart: unless-stopped

  # ===========================================================================
  # Agent 3 — Replay (ADK + KIP-932 share group), scaled to 3 replicas
  # ===========================================================================
  replay-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile.agent
    # Scale further with: docker compose -f docker-compose.app.yml up -d --scale replay-agent=5
    command: python -m replay.agent
    networks:
      - kafka-ops-agents-test
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SHARE_GROUP: replay-group
      SHARE_GROUP_LOCK_DURATION_MS: ${SHARE_GROUP_LOCK_DURATION_MS:-30000}
      SHARE_GROUP_MAX_DELIVERY_ATTEMPTS: ${SHARE_GROUP_MAX_DELIVERY_ATTEMPTS:-5}
      # Optional — leave empty to run this agent fully deterministic (no LLM call).
      REPLAY_LLM_PROVIDER: ${REPLAY_LLM_PROVIDER:-}
      REPLAY_LLM_MODEL: ${REPLAY_LLM_MODEL:-}
      REPLAY_LLM_API_KEY: ${REPLAY_LLM_API_KEY:-}
    deploy:
      replicas: 3
    restart: unless-stopped
